services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: qq-farm-bot
    restart: unless-stopped

    ports:
      - "3007:3007"               # 管理面板
      - "20000-20039:20000-20039" # 抓包登录 MITM 代理端口池（避开本机 18100 占用；配 CAPTURE_PORTS）

    volumes:
      - ../data:/app/core/data

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      ADMIN_PORT: "3007"
      FARM_DATA_DIR: /app/core/data
      CAPTURE_ADVERTISE_IPS: "${CAPTURE_ADVERTISE_IPS:-auto}"
      # 管理员首次初始化（可选）：默认空值，未设置时正常启动，已有管理员数据不受影响
      FARM_ADMIN_USERNAME: "${FARM_ADMIN_USERNAME:-}"
      FARM_ADMIN_PASSWORD: "${FARM_ADMIN_PASSWORD:-}"
      # Optional independent QQ authorization gateway; disabled by default.
      FARM_QQ_AUTH_ENABLED: "${FARM_QQ_AUTH_ENABLED:-0}"
      FARM_QQ_AUTH_ENDPOINT: "${FARM_QQ_AUTH_ENDPOINT:-}"
      FARM_QQ_AUTH_SIGNATURE: "${FARM_QQ_AUTH_SIGNATURE:-}"
      # 抓包服务已嵌入本进程，无需单独启动；端口池改为与宿主机映射一致的空闲段：
      CAPTURE_PORTS: "20000-20039"
      # 需要固定对外地址时，在 .env 中设置（局域网 / Tailscale 可同时填写）：
      # CAPTURE_ADVERTISE_IPS=203.0.113.10,198.51.100.20

    healthcheck:
      # 用 127.0.0.1 而非 localhost：容器内 localhost 会解析到 ::1，
      # 面板只监听 IPv4，导致 healthcheck 误报 unhealthy。
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
